[project]
name = "maple-inven-monitor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2,<3",
  "streamlit>=1.40,<2",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.48,<2",
]
local-analysis = [
  "duckdb>=1,<2",
  "pillow>=11,<13",
  "pytesseract>=0.3,<1",
  "scikit-learn>=1.5,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
maple-monitor = "maple_monitor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maple_monitor"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
